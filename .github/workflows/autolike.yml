name: Production Auto-Like Engine

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  automation-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node.js-version: '20'

      - name: Install Dependencies with Extra Plugins
        run: npm install

      - name: Run Stealth Automation Engine
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node bot.js
